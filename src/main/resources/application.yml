spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: focusflow
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:focusflow}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: focusflow
        format_sql: true
  flyway:
    enabled: true
    schemas: focusflow
    default-schema: focusflow
